name: Audit des dépendances

on:
  schedule:
    - cron: "0 8 * * 1"
  push:
    paths:
      - requirements.txt
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      # PYSEC-2026-3447 (setuptools) : bug de build sdist sur macOS uniquement, hors-scope.
      # setuptools est plafonné <82 par torch, donc non corrigeable sans changer torch.
      # GHSA-xmj3-9gf7-h52w (setuptools) : sévérité faible, Windows uniquement (install_as_egg), hors-scope.
      # Même blocage : correctif en 84.1.0, torch plafonne setuptools <82.
      - run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-3447 --ignore-vuln GHSA-xmj3-9gf7-h52w
